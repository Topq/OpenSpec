    ### [Server] 服务端实现

    **⚠️ 前置检查（阻断性）**：开始前先执行 `rules/apply/server-execution.md` 第 0 节（读 `develop/server/project/AGENTS.md`）。如果任务涉及 Record 表定义，属于第 1 节"生成代码合规检查"的触发范围，必须走 XML→生成器链路，不能直接手写表名宏/列枚举。

    **输入**：
    - design.md 附录 B（服务端详细设计）
    - rules/tasks/server-implementation.md（代码模板）
    - rules/apply/server-execution.md（执行规则，含生成代码合规检查、GBK 编码安全）

    **执行逻辑**：
    1. **Record 表定义**（必须走生成器链路，不是直接写 .h 宏/枚举）
       - 按 `rules/apply/server-execution.md` 第 1 节，在 `cons/res/struct/**/*.xml` 里定义/追加 record 和列（新列只能追加在末尾，不能重排已有列）
       - 运行 `struct_generator.py` 生成 `define/struct/**/struct_<name>.h`
       - 按 design.md 的持久化属性在 XML 里设置列属性，不在生成产物里手改

    2. **模块骨架生成**
       - 生成模块类文件（如 `FsGame/ActivityModule/GrowthFundModule.cpp`）
       - 实现初始化函数（OnInit、注册协议回调）
       - 涉及中文注释/字符串的文件，按 `rules/apply/server-execution.md` 第 2 节的编码安全规则操作

    3. **协议处理流程**
       - 为每个协议生成处理函数（如 `OnReqGrowthFundPurchase`）
       - 按 design.md 的校验逻辑、事务边界、奖励发放流程填充代码骨架
       - 参考 rules/tasks/server-implementation.md 的模板

    **输出**：
    - 服务端模块文件（.cpp/.h）
    - 修改过的 struct XML 源文件 + 生成器产生的 Record 定义文件

    **验证**：
    - Record 表列定义与客户端对齐
    - 协议处理函数的参数与协议定义一致
    - 确认没有直接手改任何标记 "Generated from ... Do not edit." 的产物

