    ### [Client] 客户端实现

    **输入**：
    - design.md 附录 A（客户端详细设计）
    - demo/src/**/*.tsx（React 原型源码，data-lr-* 标注）
    - rules/tasks/client-implementation.md（代码模板）

    **执行逻辑**：

    #### 任务类型 1：UI Panel 骨架生成

    **触发条件**：任务描述包含"生成 XXXPanel.cs 骨架"

    **执行步骤**：
    1. **读取 demo/src/**/*.tsx 提取结构信息**
       - 找到对应 Panel 的 `data-lr-component="surface.panel"` 节点
       - 提取所有 `data-lr-bind` → 生成成员变量声明
         - 示例：`data-lr-bind="title"` + 组件类型 `text` → `private Text m_TxtTitle;`
         - **React 优势**：动态列表项的 bind 在 `.map()` 中清晰可见
       - 提取所有 `data-lr-action` → 生成方法签名
         - 示例：`data-lr-action="onClaimClick"` → `private void OnClaimClick() { }`
         - **React 优势**：条件渲染的 action（如 `{canClaim && <button data-lr-action>`）在源码中清晰可见

    **提取方式**：
    - 直接用正则匹配 TSX 源码中的 `data-lr-*` 属性
    - 无需执行代码，因为属性都是字符串字面量

    2. **命名约定**（参考 rules/tasks/client-implementation.md）
       - Text 组件：`m_TxtXxx`
       - Button 组件：`m_BtnXxx`
       - Image 组件：`m_ImgXxx`
       - GameObject 容器：`m_GoXxx`
       - 方法名：驼峰式，首字母大写

    3. **生成 .cs 文件**
       ```csharp
       using UnityEngine;
       using UnityEngine.UI;

       public class XXXPanel : MonoBehaviour
       {
           // 成员变量（从 demo 提取）
           private Text m_TxtTitle;
           private Button m_BtnClaim;

           // 方法签名（从 demo 提取）
           private void OnClaimClick() { }

           // 生命周期方法（固定骨架）
           private void Awake() { }
           private void OnEnable() { }
           private void OnDisable() { }
       }
       ```

    **输出**：
    - `Assets/Script/UIScript/XXXPanel/XXXPanel.cs`

    **重要说明**：
    - 骨架生成**不创建 Prefab**，只生成 .cs 代码文件
    - Prefab 生成由 apply 完成后的独立 skill `lr-unity-prefab-gen` 处理
    - 独立 skill 会对着真实 .cs 文件的成员变量，逐字段验证并生成 Prefab

    #### 任务类型 2：状态机与交互逻辑实现

    **触发条件**：任务描述包含"实现 XXXPanel 状态机与交互逻辑"

    **执行步骤**：
    1. 读取 design.md 附录 A 的"状态机"章节
    2. 实现状态枚举：`enum EPanelState { Closed, Loading, Normal, ... }`
    3. 实现状态转换逻辑：`SetState(EPanelState newState)`
    4. 实现交互回调（如 `OnClaimClick` 的具体逻辑）

    **输出**：
    - 更新已存在的 `XXXPanel.cs`，填充方法实现

    #### 任务类型 3：协议收发实现

    **触发条件**：任务描述包含"实现 XXXPanel 协议收发"

    **执行步骤**：
    1. 读取 design.md 附录 A 的"协议定义"章节
    2. 实现协议发送：`SendXxxRequest()`
    3. 实现协议接收回调：`OnXxxResponse()`
    4. 实现错误处理：错误码判断、UI 提示

    **输出**：
    - 更新已存在的 `XXXPanel.cs`，添加协议收发逻辑

    #### 任务类型 4：模块实现

    **触发条件**：任务描述包含"生成 XXXModule.cs"

    **执行步骤**：
    1. 生成模块骨架（实现 `ILogicModule` 接口）
    2. 实现 `OnInit()` 方法（注册事件监听、协议回调）
    3. 实现红点逻辑、数据缓存逻辑

    **输出**：
    - `Assets/Script/LogicModule/XXXModule/XXXModule.cs`

