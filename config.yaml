schema: lr-func-dev

context: |
  这是灵刃游戏的跨端 OpenSpec 根。

  项目目录（均相对于本 OpenSpec 根目录，即 config.yaml 所在目录）：
  - 客户端工程：../develop/client/project
  - 客户端知识库：../develop/client/project/docs/ai-core
  - 服务端工程：../develop/server/project
  - 策划配置：../design/table/default_ios

  职责边界：
  - 客户端负责 Unity UI、客户端状态、表现和协议调用。
  - 服务端负责权威状态、业务校验、存储、奖励发放和协议处理。
  - 策划配置负责活动、奖励、目标、商品等数据定义。
  - 跨端业务能力必须同时分析客户端、服务端和策划配置的影响。
  - Assets/LingRen 属于客户端引擎层，除非明确要求，否则不得修改。

  技术栈：
  - 客户端：Unity 2022.3.62f2、C# 9.0、TextMeshPro、LR 自定义组件（AsyncTexture/Localizer/ScrollView 等）
  - 服务端：C++11、FsGame 框架、Record 表机制（KV 存储 + 列枚举）、协议采用 Protobuf
  - 策划配置：Excel → txt 导出、客户端自动生成代码、服务端 READ_FILE 解析

rules:
  # 产物级约束（硬性、简短、可被 validate 检查）
  proposal:
    - Capability 必须按业务能力划分，不得按技术分层。
    - Impact 必须明确标出三端各自受影响的区域和不涉及的区域。
  design:
    - 合并前必须确保三端的 Open Questions 全部解决。
  design-client:
    - 客户端状态缓存结构体（如 XxxStatus）中，若字段不是直接从 Record/协议原始字段 1:1 映射（例如需要额外计算、或来自另一个模块的查询结果），设计文档必须在"交互流程"或"数据同步"章节明确指出该字段在哪个回调/方法中被赋值，不能只在结构体定义处声明字段而不说明写入路径。
    - 若同一个 BusinessActivityType 允许同时存在多个活动实例（activityId 不同），设计文档中涉及遍历状态缓存字典（如 m_RewardStatuses）的判断逻辑（红点计算、进度汇总等）必须在伪代码中显式包含 activityId 过滤条件，不能假设"字典里只有当前活动的数据"。
  tasks:
    - 任务必须使用 [Contract]、[Config]、[Server]、[Client]、[Integration] 分类。
    - 业务逻辑任务必须标注"对应验收：TC-xxx"。
  # 注意：openspec instructions apply 使用独立渲染逻辑（generateApplyInstructions），
  # 不读取本文件的 rules 字段。apply 阶段的硬约束写在
  # schemas/lr-func-dev/schema.yaml 的 apply.instruction 里，此处不要加 apply: 键（不会生效）。
